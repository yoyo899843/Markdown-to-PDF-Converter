<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown → PDF 轉換器</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <h1>Markdown → PDF 轉換器</h1>
  <p class="subtitle">貼上或上傳 Markdown，轉換為 PDF 並下載（支援 LaTeX 數學公式：行內 $...$，區塊 $$...$$）</p>
  <p class="subtitle"><a href="/api-docs/">API 文件與線上測試</a></p>

  <div class="card">
    <div class="toolbar">
      <label class="file-btn" for="fileInput">上傳 .md 檔案</label>
      <input type="file" id="fileInput" accept=".md,.markdown,text/markdown,text/plain">
      <span class="status" id="status" role="status" aria-live="polite"></span>
    </div>
    <textarea id="markdownInput" placeholder="# 在這裡輸入或貼上 Markdown 內容...&#10;&#10;行內公式：$E = mc^2$&#10;&#10;區塊公式：&#10;$$&#10;\int_0^\infty e^{-x} dx = 1&#10;$$"></textarea>
    <div class="fields"><label>PDF 檔案名稱<input id="filename" value="document" maxlength="100"></label></div>
    <div class="actions">
      <button id="convertBtn">轉換並下載 PDF</button>
    </div>
  </div>

  <div class="card batch-card">
    <h2>批次匯出</h2>
    <label class="file-btn" for="batchInput">選取多個 Markdown 檔案</label>
    <input type="file" id="batchInput" accept=".md,.markdown,text/markdown,text/plain" multiple>
    <p class="hint">依選取的檔案順序編號，每次最多 50 份，打包為 ZIP 下載。</p>
    <div class="fields">
      <label>共同檔案名稱<input id="batchName" value="document" maxlength="100"></label>
      <label>序號類型<select id="sequence"><option value="number">數字（1、2、3）</option><option value="upper">大寫英文（A、B、…、AA）</option><option value="lower">小寫英文（a、b、…、aa）</option></select></label>
      <label>起始序號<input id="start" type="number" min="1" max="1000000" value="1"></label>
      <label>數字位數<input id="padding" type="number" min="1" max="10" value="2"></label>
      <label>檔名格式<input id="format" value="{name}_{index}" maxlength="150"></label>
    </div>
    <p class="hint">{name} 代表共同名稱，{index} 代表序號。例如：{name}-{index} 或 第{index}份_{name}。自動加上 .pdf；英文起始序號 1 = A、27 = AA。</p>
    <ol id="fileList"></ol>
    <p class="status" id="batchStatus" role="status" aria-live="polite"></p>
    <div class="actions"><button id="batchBtn" disabled>批次匯出 ZIP</button></div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
