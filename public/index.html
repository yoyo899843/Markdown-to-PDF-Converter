<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown → PDF 轉換器</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 2.5rem 1rem;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1c1e; color: #f5f5f7; }
    textarea { background: #2c2c2e !important; color: #f5f5f7 !important; border-color: #48484a !important; }
    .card { background: #2c2c2e !important; }
    label.file-btn { background: #3a3a3c !important; color: #f5f5f7 !important; }
    p.subtitle { color: #98989d !important; }
  }
  h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
  p.subtitle { color: #6e6e73; margin-top: 0; margin-bottom: 1.5rem; }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 1.5rem;
    width: 100%;
    max-width: 760px;
  }
  textarea {
    width: 100%;
    min-height: 380px;
    resize: vertical;
    border: 1px solid #d2d2d7;
    border-radius: 10px;
    padding: 1rem;
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    font-size: 0.9rem;
    line-height: 1.5;
  }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.75rem;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.75rem;
    margin-top: 1rem;
  }
  button, label.file-btn {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 0.6rem 1.2rem;
    font-size: 0.95rem;
    font-weight: 500;
  }
  #convertBtn { background: #0071e3; color: #fff; }
  #convertBtn:disabled { background: #a1a1a6; cursor: not-allowed; }
  label.file-btn { background: #e8e8ed; color: #1d1d1f; display: inline-block; }
  input[type=file] { display: none; }
  .status { font-size: 0.85rem; min-height: 1.2rem; color: #6e6e73; }
  .status.error { color: #d70015; }
</style>
</head>
<body>
  <h1>Markdown → PDF 轉換器</h1>
  <p class="subtitle">貼上或上傳 Markdown，轉換為 PDF 並下載（支援 LaTeX 數學公式：行內 $...$，區塊 $$...$$）</p>

  <div class="card">
    <div class="toolbar">
      <label class="file-btn" for="fileInput">上傳 .md 檔案</label>
      <input type="file" id="fileInput" accept=".md,.markdown,text/markdown,text/plain">
      <span class="status" id="status"></span>
    </div>
    <textarea id="markdownInput" placeholder="# 在這裡輸入或貼上 Markdown 內容...&#10;&#10;行內公式：$E = mc^2$&#10;&#10;區塊公式：&#10;$$&#10;\int_0^\infty e^{-x} dx = 1&#10;$$"></textarea>
    <div class="actions">
      <button id="convertBtn">轉換並下載 PDF</button>
    </div>
  </div>

  <script>
    const markdownInput = document.getElementById('markdownInput');
    const fileInput = document.getElementById('fileInput');
    const convertBtn = document.getElementById('convertBtn');
    const status = document.getElementById('status');

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;
      markdownInput.value = await file.text();
      status.textContent = `已載入：${file.name}`;
      status.classList.remove('error');
    });

    convertBtn.addEventListener('click', async () => {
      const markdown = markdownInput.value;
      if (!markdown.trim()) {
        status.textContent = '請先輸入 Markdown 內容';
        status.classList.add('error');
        return;
      }

      convertBtn.disabled = true;
      status.textContent = '轉換中...';
      status.classList.remove('error');

      try {
        const res = await fetch('/convert', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ markdown }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || `伺服器錯誤 (${res.status})`);
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'document.pdf';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        status.textContent = '轉換完成！';
        status.classList.remove('error');
      } catch (err) {
        status.textContent = err.message;
        status.classList.add('error');
      } finally {
        convertBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
